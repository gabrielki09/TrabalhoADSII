services:
  

  postgres:
    image: postgres:18-alpine
    container_name: oriental_systems_postgres
    restart: always
    environment:
      POSTGRES_DB: oriental_systems_db
      POSTGRES_USER: oriental_systems
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5525:5434"
    volumes:
      - oriental_systems_postgres_data:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U oriental_systems -d oriental_systems_db"]
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
  oriental_systems_postgres_data: